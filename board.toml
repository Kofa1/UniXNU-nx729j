schema_version = 2

[board]
name = "nx729j"
soc = "SM8550"
description = "Nubia RedMagic 8 Pro / 8 Pro+"
kit = "sheng" # The pinned source-storage builder reads this package from kits/sheng.
soc_source = "sm8550"
os_profile = "ipados-27.0.1-24A446"

[userdata]
first_lba = 2712360
last_lba = 121774074
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true },
]

[kernel]
defconfig = "nx729j_ipados27_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8550.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu-12377/series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "build-libpthread-kernel.py",
  "component:ShengUfs",
  "build-sheng-source-storage.py --policy-dir scripts/policies/ipados-27.0.1-24A446",
  "build-nx729j-source-storage-fallbacks.py",
  "component:RamBlock",
  "component:Adreno740",
  "fetch-sheng-dts.py",
  "fetch-adreno-inputs.py",
  "prepare-sheng-gmu.py",
  "prepare-sheng-gpu-smmu.py",
  "prepare-sheng-gmu-votes.py",
  "build-adreno740-kits.py",
  "build-adreno740-accelerator.py",
  "component:AppleKeyStoreState",
  "component:GopFramebuffer",
  "build-gop-legacy-display-27.py",
  "build-fileset-release-reference.py --tree . --lto",
  "prepare-nx729j-fileset-anchors.py",
]

[firmware]
config = "nx729j"
dsc = "Platforms/ZTE/nx729jPkg/nx729j.dsc"
fd = "Build/nx729jPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/apply-nx729j-uefi.py", "scripts/build-nx729j-dtb.py", "scripts/check-nx729j-ipados27.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}", "{uefi}/Platforms/ZTE", "{tree}/package", "{tree}/drivers/DarwinBoot",
  "{edk2}", "{uefi}/Common/Mu", "{uefi}/Common/Mu_OEM_Sample", "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium", "{uefi}/Silicium-ACPI", "{uefi}/Silicium-ACPI/Platforms/ZTE",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
DEVICE_MODEL = "nx729j"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "nx729j-research"

[payload]
volume = "NX729JESP"
size_mib = 192
root_policies = "{tree}/build/sheng-source-storage/root-policies.bin"
trust_cache_sha256 = ["dc655bcb2ddfaea214f9ec83659b3fc8d8b658bafac2b5a004fb4179a25c89bf"]
loader = "firmware"
title = "nx729j iPadOS 27 kernel-entry bring-up"
# The DTB reports the contiguous, unreserved 5 GiB bank at 0x8c0000000.
# The full 16 GiB physical layout remains in /ddr-regions.
dram_size = "0x140000000"
panic_screen = false
kernel_args = [
  "-v", "serial=3", "debug=0x14e", "kt_fixed_zones=120", "-no_slto_panic", "use_contiguous_hint=0",
  "native-source-storage=1", "native-ufs-root=1",
    "sheng-aks=1", "offline-hid-input=1", "offline-hid-home=1", "sheng-buttons=1",
  "sheng-log=1", "sheng-smp=1", "armcpu-spi-ipi=1", "armcpu-self-ipi=1",
    "sheng-disable-watchdogd=1", "sheng-lite=1",
]
skip_setup_tool = "scripts/seed-data-skip-setup.py"

[payload.adt]
chip_id = "207"
owned_memory_size = "0x130000000"
root_match_volume_uuid = "2F8E6EED-68D5-4261-B8A3-12571BAA2DD4"
packed_data_ramdisk = true
persistent_data = true
unique_chip_id = "required"

[bootimg]
dtb = "build/nx729j/nx729j.dtb"

[bootimg.image]
# The pinned UniXNU packer/verifier supports this device's legacy v0 header.
# The pinned uefi-sheng config requests v4, which its verifier cannot parse.
header_version = 0

[device_tree]
source = "device:dts/nx729j.dts"
include_dirs = ["soc:dts"]

[components]
include = ["ArmDTPlatform", "ArmCpu", "XnuPrelink", "DarwinBoot", "ShengPreflight", "ShengUfs", "RamBlock", "Adreno740", "AppleKeyStoreState", "GopFramebuffer"]
[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-27.0.1-24A446" = "nx729j_ipados27_defconfig"


[payload.runtime]
tool = "scripts/build-boot-runtime.py"
target = "ios27"
build = "24A446"
data_gib = 215
skip_setup = true
trust_components = ["StaticTrustCache", "Cryptex1,SystemTrustCache", "Cryptex1,AppTrustCache"]
wallpapers = ["ipados27", "ipados27-floating"]

[adt.defaults.u32]
"sleep-disabled" = 1
"vmm-present" = 1
"kern.maxvnodes" = 78848

[adt.chosen.u32]
"kernel-ctrr-to-be-enabled" = 0
